[package]
name = "nyala-runtime"
# Reported as `runtimeBuild` in the runtime.hello result.
version = "0.1.0-dev.0"
description = "Nyala Studio SQL Runtime sidecar speaking Nyala RPC v1 over stdio"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# `column_decltype`: the declared type of a result column (N-105/N-106).
# `hooks`: SQLite's progress callback, which is how a query timeout ends a running statement.
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled", "column_decltype", "hooks"] }
serde_json = "1.0.140"

[dev-dependencies]
regex = "1.11"
