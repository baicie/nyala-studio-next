name: Nyala Baseline

on:
  push:
    branches:
      - nyala/main
      - 'release/*'
  pull_request:
    branches:
      - nyala/main
      - 'release/*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nyala-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  product:
    name: Product baseline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Validate product metadata
        run: npm run nyala:validate-product

      - name: Validate RPC contract
        run: npm run nyala:validate-rpc

  client:
    name: Client typecheck and hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Prepare Electron types
        run: node build/npm/electronTypes.ts

      - name: Typecheck client
        run: npm run typecheck-client

      # The root install skips postinstall, which normally installs build/ dependencies
      # (e.g. gulp-merge-json) that the gulpfiles import when gulp loads.
      - name: Install build dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: build

      - name: Hygiene
        run: npm run gulp hygiene

      - name: Check diff
        run: git diff --check

  unit-tests:
    name: Unit tests (node)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Prepare Electron types
        run: node build/npm/electronTypes.ts

      # build-fast.ts imports esbuild from build/node_modules, which the root install skips.
      - name: Install build dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: build

      # The node test runner loads compiled tests from out/, so transpile the client first.
      - name: Build client (transpile)
        run: npm run build-fast -- --client-only

      # Browser-only suites (src/vs/workbench/contrib/nyala/test/browser) cannot load in this
      # runner; PROGRESS.md gap 7 tracks them separately.
      - name: Unit tests (node)
        run: >
          node test/unit/node/index.js
          --run src/vs/platform/extensionManagement/test/node/extensionsScannerService.test.ts
          --run src/vs/workbench/contrib/nyala/test/common/nyalaDisabledChat.test.ts

  rust:
    name: Rust runtime
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Uses the stable toolchain that rustup preinstalls on the runner, so no third-party
      # toolchain action is added. The versions are printed as evidence for the run.
      - name: Prepare Rust toolchain
        run: |
          rustup component add rustfmt clippy
          rustc --version
          cargo --version
          cargo clippy --version
          cargo fmt --version

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

  browser-tests:
    name: Browser tests (manual)
    # The Nyala workbench bootstrap test lives under test/browser, which the node runner
    # excludes. It needs a real browser, so it runs only on workflow_dispatch instead of on
    # every PR (a full client build plus a Chromium download would roughly double PR latency).
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Prepare Electron types
        run: node build/npm/electronTypes.ts

      - name: Install build dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: build

      # Browser suites load compiled modules from out/. Use the transpile-only build: a full
      # `npm run compile` also typechecks extension media with tsgo, which needs per-extension
      # dependency installs this workflow does not do.
      - name: Build client (transpile)
        run: npm run build-fast -- --client-only

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser tests (Nyala workbench)
        run: >
          node test/unit/browser/index.js
          --browser chromium
          --reporter spec
          --run src/vs/workbench/contrib/nyala/test/browser/nyalaBootstrap.test.ts

